<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js" ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>    
    <link rel="stylesheet" href="css/style.css"/>
    <title>WorldClock</title>
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <select id="city">
            <option value="">Select a city</option>
            <option value="current">My current location</option>
            <option value="Europe/London">London 🇬🇧</option>
            <option value="Asia/Tokyo">Tokyo 🇯🇵</option>
            <option value="America/Los_Angeles">Los Angeles 🇺🇸</option>
            <option value="Australia/Sydney">Sydney 🇦🇺</option>
            <option value="Europe/Rome">Rome 🇮🇹</option>

        </select>
        <div class="cities">
        <div class="city" id= "los-angeles">
            <div>
                <h2>Los Angeles 🇺🇸 </h2>
                <div class="date">August 11th 2025</div>
            </div>
            <div class="time">1:28:32 <small> PM </small></div>
        </div>    
        <div class="city" id="rome">
            <div>
                <h2>Rome 🇮🇹</h2>
                <div class="date">August 11th 2025</div>
            </div>
            <div class="time">1:28:32 <small> PM </small></div>
        </div>    
        </div>
    </div>

    <footer>Coded by Vita Franchina. 
        <a href="https://github.com/VitaFrnkn/WorldClock">
            Open source on GitHub</a>
    </footer>
      
<script src="javascript/index.js"></script>
</body>
</html>
